<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11141a">
  <title>Bible Family Tree Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mock-banner" role="note">
    <strong>MOCK DATA</strong> — demo family. Real Bible characters come in phase 2.
  </div>

  <header class="topbar">
    <h1>Bible Family Tree Explorer</h1>
    <div class="controls" role="search">
<button id="filters-btn" class="btn filters-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="filter-panel">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Filters</span><span id="filters-badge" class="filters-badge" hidden></span>
      </button>
      <button id="clear-filters" class="btn ghost" type="button" hidden>Clear</button>
    </div>
  </header>

  <!-- Outside the top bar so it can be a fixed bottom sheet on phones without
       its width feeding back into the top bar's wrapping. -->
  <div id="filter-backdrop" class="filter-backdrop" hidden></div>
  <section id="filter-panel" class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="fp-head">
      <h2 id="filter-title">Filters</h2>
      <button id="filter-close" class="btn ghost close" type="button" aria-label="Close filters">✕</button>
    </div>
    
    <div class="fp-body">
      <div id="filter-rows"></div>
      <button id="add-filter-row" class="btn ghost small" type="button">
        <svg class="icon icon-plus" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        Add filter
      </button>
    </div><div class="fp-foot">
      <span id="filter-count" class="fp-count" aria-live="polite"></span>
      <button id="filter-reset" class="btn" type="button">Clear filters</button>
    </div>
  </section>

  <div id="data-warning" class="data-warning" hidden></div>

  <main class="layout">
    <aside id="results-pane" class="results-pane" aria-label="Search results">
      <div class="results-head">
        <span id="results-count">Loading…</span>
        <button id="results-toggle" class="btn ghost small" type="button" aria-expanded="true">Hide</button>
      </div>
      <ul id="results" class="results"></ul>
    </aside>

    <section class="tree-pane" aria-label="Family tree">
      <div class="legend" aria-label="Legend">
        <span class="lg lg-female">♀ mom, left · <i class="lg-swatch sw-mom"></i> pink line ↓</span>
        <span class="lg lg-male">♂ dad, right · <i class="lg-swatch sw-dad"></i> blue line ↓</span>
        <span class="lg"><i class="lg-pill"></i> junction · <i class="lg-swatch sw-child"></i> light line ↓ to each child</span>
        <span class="lg"><svg class="icon icon-info" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7.6" r="1.45" fill="currentColor"/><rect x="10.85" y="10.4" width="2.3" height="7.4" rx="1.15" fill="currentColor"/></svg> has notes</span>
        <span class="lg">⧉ remarried, shown in each union</span>
      </div>
      <div class="zoom-controls">
        <button class="btn small" type="button" data-zoom="out" aria-label="Zoom out">−</button>
        <button class="btn small" type="button" data-zoom="reset" aria-label="Reset zoom">100%</button>
        <button class="btn small" type="button" data-zoom="in" aria-label="Zoom in">+</button>
      </div>
      <div id="viewport" class="viewport" tabindex="0">
        <div id="sizer" class="sizer">
          <div id="canvas" class="canvas">
            <svg id="links" class="links" aria-hidden="true"></svg>
            <div id="nodes"></div>
          </div>
        </div>
      </div>
      <div id="status" class="status" hidden></div>
    </section>

    <aside id="detail" class="detail" aria-label="Person details" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <button id="detail-close" class="btn ghost close" type="button" aria-label="Close details">✕</button>
      <div id="detail-body"></div>
    </aside>
  </main>

  <script src="family.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
